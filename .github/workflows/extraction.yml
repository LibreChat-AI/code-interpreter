name: Extraction Service
on:
    pull_request:
        paths: ['packages/extraction/**', '.github/workflows/extraction.yml']
    push:
        branches: [main]
        paths: ['packages/extraction/**', '.github/workflows/extraction.yml']
permissions:
    contents: read
jobs:
    extraction:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24.16.0
                  cache: npm
                  cache-dependency-path: packages/extraction/package-lock.json
            - run: npm ci --ignore-scripts
              working-directory: packages/extraction
            - run: npm run format:check && npm run typecheck && npm test
              working-directory: packages/extraction
            - run: npm run test:container
              working-directory: packages/extraction
