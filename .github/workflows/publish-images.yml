# Builds and publishes the 6 container images this project's own CI only
# ever validates (`docker buildx build --check`) but never pushes anywhere —
# upstream ships no published images at all; its own docs assume you build
# locally (see helm/codeapi/values-local.yaml, pullPolicy: Never). This fork
# exists specifically to publish real, pullable images for
# ADORSYS-GIS/ai-helm's charts/librechat-code-interpreter (ADR-0122 there).
#
# NsJail (non-KVM) sandbox mode only: sandbox-runner is built from the
# `sandbox-runner` target, not `sandbox-runner-baked` (KVM microVM path,
# unused — see the ai-helm ADR for why). launcher/ and
# docker/Dockerfile.worker-sandbox are KVM-only artifacts and intentionally
# not built here.
name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_NAMESPACE: adorsys-gis

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: code-interpreter-api
            dockerfile: service/Dockerfile.api
            target: production
          - image: code-interpreter-worker
            dockerfile: service/Dockerfile.worker
            target: production
          - image: code-interpreter-tool-call-server
            dockerfile: service/Dockerfile.tool-call-server
            target: production
          - image: code-interpreter-egress-gateway
            dockerfile: service/Dockerfile.egress-gateway
            target: production
          - image: code-interpreter-file-server
            dockerfile: service/Dockerfile
            target: production
          - image: code-interpreter-sandbox-runner
            dockerfile: api/Dockerfile
            target: sandbox-runner
          - image: code-interpreter-package-init
            dockerfile: docker/Dockerfile.package-init
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:sha-${{ steps.sha.outputs.short }}
