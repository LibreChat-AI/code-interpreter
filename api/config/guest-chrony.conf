# Chrony configuration for CodeAPI KVM microVM guest
# Synchronizes guest CLOCK_REALTIME directly from host via KVM virtual PTP hardware clock (/dev/ptp0).
# The KVM virtual PTP device provides host CLOCK_REALTIME (UTC, no TAI offset).
refclock PHC /dev/ptp0 poll 0 dpoll -2

# Only the first update may step: the API starts after synchronization.
# Subsequent corrections slew the clock rather than jumping active jobs.
makestep 0.1 1

# Disable network NTP server and monitoring ports; operate strictly in refclock mode.
port 0
cmdport 0

# Restrict control interface to a private Unix domain socket and fixed pidfile.
bindcmdaddress /run/codeapi-clock/chronyd.sock
pidfile /run/codeapi-clock/chronyd.pid
