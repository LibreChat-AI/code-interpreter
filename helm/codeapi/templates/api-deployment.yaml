{{/*
API Deployment
This creates the API pods that handle HTTP requests.
It doesn't run workers - just submits jobs to the queue.
*/}}
{{- if and .Values.api.enabled (not .Values.egressGateway.enabled) }}
{{- fail "api.enabled requires egressGateway.enabled=true because sandbox-originated file and PTC traffic must not bypass the egress gateway" }}
{{- end }}
{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeapi.fullname" . }}-api
  labels:
    {{- include "codeapi.api.labels" . | nindent 4 }}
  {{- with .Values.api.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "codeapi.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- mergeOverwrite (deepCopy .Values.api.podAnnotations) (dict "codeapi.librechat.ai/pairing-fence-version" "1") | toYaml | nindent 8 }}
      labels:
        {{- include "codeapi.podLabels" (dict "root" . "component" "api" "values" .Values.api) | nindent 8 }}
    spec:
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.api.serviceAccount.create .Values.api.serviceAccount.name }}
      serviceAccountName: {{ .Values.api.serviceAccount.name | default (printf "%s-api" (include "codeapi.fullname" .)) }}
      {{- end }}
      {{- include "codeapi.automountServiceAccountToken" .Values.api.serviceAccount | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
{{ include "codeapi.otel.env" (dict "root" . "serviceName" "aiml-codeapi-api") | nindent 12 }}
            - name: CODEAPI_HARDENED_SANDBOX_MODE
              value: {{ .Values.hardenedSandboxMode | quote }}
            {{- with .Values.executionProfile }}
            - name: CODEAPI_EXECUTION_PROFILE
              value: {{ . | quote }}
            {{- end }}
            # Redis connection
            - name: REDIS_HOST
              value: {{ include "codeapi.redis.host" . }}
            - name: REDIS_PORT
              value: {{ include "codeapi.redis.port" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.redisPassword }}
            - name: CODEAPI_BRIDGE_PAIRING_ROLLBACK_EPOCH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "codeapi.fullname" . }}-pairing-rollback
                  key: epoch
                  optional: true
            # Service URLs
            - name: FILE_SERVER_URL
              value: "http://{{ include "codeapi.fullname" . }}-file-server:{{ .Values.fileServer.service.port }}"
            - name: TOOL_CALL_SERVER_URL
              value: "http://{{ include "codeapi.fullname" . }}-tool-call-server:{{ .Values.toolCallServer.service.port }}"
            - name: EGRESS_GATEWAY_URL
              value: "http://{{ include "codeapi.fullname" . }}-egress-gateway:{{ .Values.egressGateway.service.port }}"
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.internalServiceToken }}
            - name: EGRESS_GRANT_TTL_SECONDS
              value: {{ .Values.egressGrant.ttlSeconds | quote }}
            # Server config
            - name: SERVICE_PORT
              value: {{ .Values.api.service.port | quote }}
            - name: CODEAPI_HTTP_JSON_LIMIT
              value: {{ .Values.api.httpJsonLimit | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
