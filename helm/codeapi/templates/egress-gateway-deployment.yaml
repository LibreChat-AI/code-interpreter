{{/*
Egress Gateway
Only sandbox-runner can call this service. It validates encrypted grants and
delegates to file-server/tool-call-server with internal credentials.
*/}}
{{- if .Values.egressGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeapi.fullname" . }}-egress-gateway
  labels:
    {{- include "codeapi.egressGateway.labels" . | nindent 4 }}
  {{- with .Values.egressGateway.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.egressGateway.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  replicas: {{ .Values.egressGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "codeapi.egressGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.egressGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codeapi.podLabels" (dict "root" . "component" "egressGateway" "values" .Values.egressGateway) | nindent 8 }}
    spec:
      {{- with .Values.egressGateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.egressGateway.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.egressGateway.serviceAccount.create .Values.egressGateway.serviceAccount.name }}
      serviceAccountName: {{ .Values.egressGateway.serviceAccount.name | default (printf "%s-egress-gateway" (include "codeapi.fullname" .)) }}
      {{- end }}
      {{- include "codeapi.automountServiceAccountToken" .Values.egressGateway.serviceAccount | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.egressGrant.ledgerRequired .Values.hardenedSandboxMode }}
      initContainers:
        - name: wait-for-redis
          {{- with .Values.egressGateway.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.egressGateway.initImage.repository }}:{{ .Values.egressGateway.initImage.tag }}"
          command: ['sh', '-c', 'until nc -z {{ include "codeapi.redis.host" . }} {{ include "codeapi.redis.port" . }}; do echo waiting for redis; sleep 2; done']
      {{- end }}
      containers:
        - name: egress-gateway
          {{- with .Values.egressGateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.egressGateway.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.egressGateway.image.repository }}:{{ .Values.egressGateway.image.tag }}"
          imagePullPolicy: {{ .Values.egressGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.egressGateway.service.port }}
              protocol: TCP
          env:
{{ include "codeapi.otel.env" (dict "root" . "serviceName" "aiml-codeapi-egress-gateway") | nindent 12 }}
            - name: SERVICE_NAME
              value: egress-gateway
            - name: CODEAPI_HARDENED_SANDBOX_MODE
              value: {{ .Values.hardenedSandboxMode | quote }}
            - name: CODEAPI_EGRESS_LEDGER_REQUIRED
              value: {{ .Values.egressGrant.ledgerRequired | quote }}
            - name: CODEAPI_INPUT_MANIFEST_MAX_FILES
              value: {{ .Values.egressGrant.inputManifestMaxFiles | quote }}
            - name: CODEAPI_INPUT_MANIFEST_CONCURRENCY
              value: {{ .Values.egressGrant.inputManifestConcurrency | quote }}
            - name: CODEAPI_INPUT_MANIFEST_TIMEOUT_MS
              value: {{ .Values.egressGrant.inputManifestTimeoutMs | quote }}
            - name: CODEAPI_EGRESS_LEDGER_COMPACT
              value: {{ .Values.egressGrant.ledgerCompact | quote }}
            - name: CODEAPI_EGRESS_LEDGER_TTL_GRACE_SECONDS
              value: {{ .Values.egressGrant.ledgerTtlGraceSeconds | quote }}
            - name: EGRESS_GATEWAY_PORT
              value: {{ .Values.egressGateway.service.port | quote }}
            - name: EGRESS_GATEWAY_FILE_SERVER_URL
              value: "http://{{ include "codeapi.fullname" . }}-file-server:{{ .Values.fileServer.service.port }}"
            - name: EGRESS_GATEWAY_TOOL_CALL_SERVER_URL
              value: "http://{{ include "codeapi.fullname" . }}-tool-call-server:{{ .Values.toolCallServer.service.port }}"
            - name: EGRESS_GATEWAY_MAX_TOOL_CALL_BYTES
              value: {{ printf "%.0f" (.Values.egressGateway.config.maxToolCallBytes | float64) | quote }}
            - name: CODEAPI_EGRESS_GRANT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.egressGrantSecret }}
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.internalServiceToken }}
            - name: REDIS_HOST
              value: {{ include "codeapi.redis.host" . }}
            - name: REDIS_PORT
              value: {{ include "codeapi.redis.port" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.redisPassword }}
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.egressGateway.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeapi.fullname" . }}-egress-gateway
  labels:
    {{- include "codeapi.egressGateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.egressGateway.service.type }}
  ports:
    - port: {{ .Values.egressGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "codeapi.egressGateway.selectorLabels" . | nindent 4 }}
{{- end }}
