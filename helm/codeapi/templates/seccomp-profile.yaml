{{/*
Seccomp Profile ConfigMap
Contains the custom NsJail seccomp profile for syscall filtering.

INSTALLATION:
The profile must be installed on each node before pods can use it.
For minikube: minikube cp <profile> /var/lib/kubelet/seccomp/profiles/nsjail.json
For production: Use a DaemonSet or node configuration management.

See seccomp/README.md for detailed instructions.
*/}}
{{- if and .Values.workerSandbox ((.Values.workerSandbox).seccomp) ((.Values.workerSandbox.seccomp).enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codeapi.fullname" . }}-seccomp-profile
  labels:
    {{- include "codeapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
data:
  nsjail.json: |
    {
      "defaultAction": "SCMP_ACT_ERRNO",
      "defaultErrnoRet": 1,
      "archMap": [
        {
          "architecture": "SCMP_ARCH_X86_64",
          "subArchitectures": ["SCMP_ARCH_X86", "SCMP_ARCH_X32"]
        },
        {
          "architecture": "SCMP_ARCH_AARCH64",
          "subArchitectures": ["SCMP_ARCH_ARM"]
        }
      ],
      "syscalls": [
        {
          "comment": "Allow socket(AF_UNIX) for local process plumbing. Socket domains are enumerated instead of broadly allowed so AF_ALG (Copy Fail / CVE-2026-31431) and AF_RXRPC (Dirty Frag / CVE-2026-43500) fall through to SCMP_ACT_ERRNO.",
          "names": ["socket"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 1, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Allow socket(AF_INET) for sandbox-runner HTTP and egress-gateway forwarding.",
          "names": ["socket"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 2, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Allow socket(AF_INET6) for dual-stack Docker/Kubernetes networking.",
          "names": ["socket"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 10, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Allow socket(AF_NETLINK) for NsJail/network namespace setup.",
          "names": ["socket"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 16, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Allow socket(AF_VSOCK) for KVM/libkrun host-side plumbing.",
          "names": ["socket"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 40, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Base syscalls - standard operations",
          "names": [
            "accept", "accept4", "access", "alarm", "bind", "brk", "capget", "capset",
            "chdir", "chmod", "chown", "chown32", "clock_getres", "clock_getres_time64",
            "clock_gettime", "clock_gettime64", "clock_nanosleep", "clock_nanosleep_time64",
            "close", "close_range", "connect", "copy_file_range", "creat", "dup", "dup2", "dup3",
            "epoll_create", "epoll_create1", "epoll_ctl", "epoll_pwait", "epoll_pwait2", "epoll_wait",
            "eventfd", "eventfd2", "execve", "execveat", "exit", "exit_group",
            "faccessat", "faccessat2", "fadvise64", "fallocate", "fchdir", "fchmod", "fchmodat",
            "fchown", "fchown32", "fchownat", "fcntl", "fcntl64", "fdatasync",
            "fgetxattr", "flistxattr", "flock", "fork", "fremovexattr", "fsetxattr",
            "fstat", "fstat64", "fstatat64", "fstatfs", "fstatfs64", "fsync",
            "ftruncate", "ftruncate64", "futex", "futex_time64", "futimesat",
            "getcpu", "getcwd", "getdents", "getdents64", "getegid", "getegid32",
            "geteuid", "geteuid32", "getgid", "getgid32", "getgroups", "getgroups32",
            "getitimer", "getpeername", "getpgid", "getpgrp", "getpid", "getppid",
            "getpriority", "getrandom", "getresgid", "getresgid32", "getresuid", "getresuid32",
            "getrlimit", "getrusage", "getsid", "getsockname", "getsockopt", "gettid",
            "gettimeofday", "getuid", "getuid32", "getxattr",
            "inotify_add_watch", "inotify_init", "inotify_init1", "inotify_rm_watch",
            "io_cancel", "io_destroy", "io_getevents", "io_setup", "io_submit",
            "ioctl", "kill",
            "landlock_add_rule", "landlock_create_ruleset", "landlock_restrict_self",
            "lchown", "lchown32", "lgetxattr", "link", "linkat", "listen",
            "listxattr", "llistxattr", "lremovexattr", "lseek", "lsetxattr", "lstat", "lstat64",
            "madvise", "membarrier", "memfd_create", "memfd_secret", "mincore",
            "mkdir", "mkdirat", "mknod", "mknodat", "mlock", "mlock2", "mlockall",
            "mmap", "mmap2", "mprotect", "mq_getsetattr", "mq_notify", "mq_open",
            "mq_timedreceive", "mq_timedreceive_time64", "mq_timedsend", "mq_timedsend_time64", "mq_unlink",
            "mremap", "msgctl", "msgget", "msgrcv", "msgsnd", "msync",
            "munlock", "munlockall", "munmap", "nanosleep", "newfstatat",
            "open", "openat", "openat2", "pause", "pipe", "pipe2", "poll", "ppoll", "ppoll_time64",
            "prctl", "pread64", "preadv", "preadv2", "prlimit64", "pselect6", "pselect6_time64",
            "pwrite64", "pwritev", "pwritev2", "read", "readahead", "readlink", "readlinkat", "readv",
            "recv", "recvfrom", "recvmmsg", "recvmmsg_time64", "recvmsg",
            "remap_file_pages", "removexattr", "rename", "renameat", "renameat2",
            "restart_syscall", "rmdir", "rseq",
            "rt_sigaction", "rt_sigpending", "rt_sigprocmask", "rt_sigqueueinfo",
            "rt_sigreturn", "rt_sigsuspend", "rt_sigtimedwait", "rt_sigtimedwait_time64", "rt_tgsigqueueinfo",
            "sched_get_priority_max", "sched_get_priority_min", "sched_getaffinity",
            "sched_getattr", "sched_getparam", "sched_getscheduler", "sched_rr_get_interval",
            "sched_rr_get_interval_time64", "sched_setaffinity", "sched_setattr",
            "sched_setparam", "sched_setscheduler", "sched_yield", "seccomp",
            "select", "semctl", "semget", "semop", "semtimedop", "semtimedop_time64",
            "send", "sendfile", "sendfile64", "sendmmsg", "sendmsg", "sendto",
            "set_robust_list", "set_thread_area", "set_tid_address",
            "setfsgid", "setfsgid32", "setfsuid", "setfsuid32", "setgid", "setgid32",
            "setgroups", "setgroups32", "setitimer", "setpgid", "setpriority",
            "setregid", "setregid32", "setresgid", "setresgid32", "setresuid", "setresuid32",
            "setreuid", "setreuid32", "setrlimit", "setsid", "setsockopt", "setuid", "setuid32", "setxattr",
            "shmat", "shmctl", "shmdt", "shmget", "shutdown", "sigaltstack", "signalfd", "signalfd4",
            "socketpair", "splice", "stat", "stat64", "statfs", "statfs64", "statx",
            "symlink", "symlinkat", "sync", "sync_file_range", "syncfs", "sysinfo", "tee", "tgkill",
            "time", "timer_create", "timer_delete", "timer_getoverrun", "timer_gettime",
            "timer_gettime64", "timer_settime", "timer_settime64",
            "timerfd_create", "timerfd_gettime", "timerfd_gettime64", "timerfd_settime", "timerfd_settime64",
            "times", "tkill", "truncate", "truncate64", "ugetrlimit", "umask", "uname",
            "unlink", "unlinkat", "utime", "utimensat", "utimensat_time64", "utimes",
            "vfork", "vmsplice", "wait4", "waitid", "waitpid", "write", "writev"
          ],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "NsJail namespace operations - requires CAP_SYS_ADMIN",
          "names": ["clone", "clone3", "setns", "unshare", "sethostname", "setdomainname"],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "NsJail mount operations - requires CAP_SYS_ADMIN",
          "names": ["mount", "open_tree", "mount_setattr", "move_mount", "umount", "umount2", "pivot_root"],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "NsJail chroot - requires CAP_SYS_CHROOT",
          "names": ["chroot"],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "NsJail ptrace for process control - requires CAP_SYS_PTRACE",
          "names": ["ptrace", "process_vm_readv", "process_vm_writev"],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "Personality - needed for some sandboxed programs",
          "names": ["personality"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 0, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "Personality - allow reading current personality",
          "names": ["personality"],
          "action": "SCMP_ACT_ALLOW",
          "args": [{"index": 0, "value": 4294967295, "op": "SCMP_CMP_EQ"}]
        },
        {
          "comment": "arch_prctl for x86_64",
          "names": ["arch_prctl"],
          "action": "SCMP_ACT_ALLOW"
        },
        {
          "comment": "Kernel keyring - may be needed by some programs",
          "names": ["keyctl", "add_key", "request_key"],
          "action": "SCMP_ACT_ALLOW"
        }
      ]
    }
{{- end }}
