{{/* Optional accounts for the HTTP API and gateway services. */}}
{{- range $component := list "api" "toolCallServer" "egressGateway" }}
{{- $values := index $.Values $component }}
{{- $suffix := get (dict "api" "api" "toolCallServer" "tool-call-server" "egressGateway" "egress-gateway") $component }}
{{- if and $values.enabled $values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $values.serviceAccount.name | default (printf "%s-%s" (include "codeapi.fullname" $) $suffix) }}
  labels:
    {{- include (printf "codeapi.%s.labels" $component) $ | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "codeapi.automountServiceAccountToken" $values.serviceAccount | nindent 0 }}
{{- end }}
{{- end }}
