{{/*
Tool Call Server Deployment
Handles programmatic tool calling (callbacks from sandbox).
Stateless - scales independently.
*/}}
{{- if .Values.toolCallServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "codeapi.fullname" . }}-tool-call-server
  labels:
    {{- include "codeapi.toolCallServer.labels" . | nindent 4 }}
  {{- with .Values.toolCallServer.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.toolCallServer.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  replicas: {{ .Values.toolCallServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "codeapi.toolCallServer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.toolCallServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "codeapi.podLabels" (dict "root" . "component" "toolCallServer" "values" .Values.toolCallServer) | nindent 8 }}
    spec:
      {{- with .Values.toolCallServer.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.toolCallServer.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.toolCallServer.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.toolCallServer.serviceAccount.create .Values.toolCallServer.serviceAccount.name }}
      serviceAccountName: {{ .Values.toolCallServer.serviceAccount.name | default (printf "%s-tool-call-server" (include "codeapi.fullname" .)) }}
      {{- end }}
      {{- include "codeapi.automountServiceAccountToken" .Values.toolCallServer.serviceAccount | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tool-call-server
          {{- with .Values.toolCallServer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.toolCallServer.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.toolCallServer.image.repository }}:{{ .Values.toolCallServer.image.tag }}"
          imagePullPolicy: {{ .Values.toolCallServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.toolCallServer.service.port }}
              protocol: TCP
          env:
{{ include "codeapi.otel.env" (dict "root" . "serviceName" "aiml-codeapi-tool-call-server") | nindent 12 }}
            # Redis connection
            - name: REDIS_HOST
              value: {{ include "codeapi.redis.host" . }}
            - name: REDIS_PORT
              value: {{ include "codeapi.redis.port" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.redisPassword }}
            - name: CODEAPI_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "codeapi.secretName" . }}
                  key: {{ .Values.secrets.keys.internalServiceToken }}
            # Server config
            - name: TOOL_CALL_SERVER_PORT
              value: {{ .Values.toolCallServer.service.port | quote }}
            - name: TOOL_CALL_REQUEST_TIMEOUT
              value: {{ .Values.toolCallServer.config.requestTimeout | quote }}
            - name: TOOL_CALL_SESSION_EXPIRY
              value: {{ .Values.toolCallServer.config.sessionExpiry | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.toolCallServer.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "codeapi.fullname" . }}-tool-call-server
  labels:
    {{- include "codeapi.toolCallServer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.toolCallServer.service.type }}
  ports:
    - port: {{ .Values.toolCallServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "codeapi.toolCallServer.selectorLabels" . | nindent 4 }}
{{- end }}
